<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Runde">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Runde</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#0b0b14;--s1:#14141f;--s2:#1c1c2c;--line:#2a2a44;
  --tx:#ece9f5;--mut:#8f8ca8;
  --gold:#D4AF37;--vio:#A78BFA;
  --bad:#f87171;--ok:#34d399;--warn:#fbbf24;
  --nav:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
h1,h2{margin:0}
.muted{color:var(--mut)}
.tiny{font-size:12px}
.center{text-align:center}
em{font-style:normal;font-size:11px;color:var(--vio);border:1px solid rgba(167,139,250,.4);border-radius:99px;padding:0 6px;margin-left:6px;vertical-align:1px}

.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mut);background:var(--bg);z-index:100}

/* ---------- Anmeldung ---------- */
#screen-auth{min-height:100dvh;display:grid;place-items:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.auth-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.logo-mark{width:64px;height:64px;border-radius:20px;margin:0 auto;display:grid;place-items:center;
  background:linear-gradient(145deg,#1c1c2c,#10101c);border:1px solid var(--line);color:var(--gold)}
.logo-mark .ic{width:32px;height:32px}
.auth-card h1{text-align:center;font-size:34px;letter-spacing:.5px;color:var(--gold)}
.auth-card p{margin:0}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
input[type=text],input[type=email],input[type=password],input[type=number],select{
  background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--tx);font-size:16px;width:100%;min-height:46px}
input:focus,select:focus{outline:2px solid var(--vio);outline-offset:0;border-color:transparent}
label.check{flex-direction:row;align-items:center;gap:10px;color:var(--tx);font-size:14px}
label.check input{width:20px;height:20px;accent-color:var(--gold)}
.msg{margin:0;min-height:20px;font-size:14px;color:var(--bad)}
.msg.ok{color:var(--ok)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--s2);
  border-radius:12px;padding:12px 16px;min-height:46px;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#17130a}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:0;background:transparent;color:var(--mut);cursor:pointer}
.icon-btn.on{color:var(--warn)}
.icon-btn:active{background:var(--s2)}

.seg{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 10px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--s2);color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}
.seg.scroll{flex-wrap:wrap}
.seg.scroll button{flex:1 1 auto}

/* ---------- App-Gerüst ---------- */
#screen-app{height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.sel{position:relative;flex:1;min-width:0}
.sel select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font-size:20px;font-weight:700;color:var(--gold);padding:6px 28px 6px 0;min-height:0;text-overflow:ellipsis}
.sel .ic{position:absolute;right:2px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mut);width:18px;height:18px}
#view{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px calc(var(--nav) + 24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#view.flush{padding:0;overflow:hidden}
.stack{display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}

.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  height:calc(var(--nav) + env(safe-area-inset-bottom));padding:0 6px env(safe-area-inset-bottom);
  background:rgba(11,11,20,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--mut);font-size:11px;padding:8px 0;cursor:pointer}
.tabs button.on{color:var(--gold)}
.tabs .plus{width:58px;height:58px;margin:-22px auto 0;border-radius:50%;justify-content:center;padding:0;
  background:linear-gradient(145deg,#e6c24f,#b8932a);color:#17130a;box-shadow:0 6px 22px rgba(212,175,55,.35),0 0 0 5px var(--bg)}
.tabs .plus .ic{width:28px;height:28px;stroke-width:2.4}

/* ---------- Karten, Listen ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:18px}
.card p{margin:0}
.card-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.empty{text-align:center;padding:36px 12px;color:var(--tx)}
.inline-form{flex-direction:row;gap:8px}
.inline-form input{flex:1;min-width:0}
.row-btns{display:flex;gap:8px}
.row-btns .btn{flex:1}

.meters{gap:10px}
.meter-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.meter-head b{font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--s2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--vio);border-radius:99px;transition:width .4s}
.meter.warn .bar i{background:var(--warn)}
.meter.full .bar i{background:var(--bad)}

.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.row.me{border-color:rgba(167,139,250,.55)}
.row.first{border-color:rgba(212,175,55,.6);background:linear-gradient(180deg,rgba(212,175,55,.08),var(--s1))}
.pos{width:22px;text-align:center;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.row.first .pos{color:var(--gold)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#0b0b14;background:var(--c,#D4AF37);flex:none}
.av.sm{width:30px;height:30px;font-size:14px}
.who{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mut);font-size:12px}
.pts{font-size:30px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:-.5px}

.feed{gap:10px}
.item{display:flex;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px}
.item.disputed{opacity:.55}
.thumb{width:76px;height:76px;flex:none;border-radius:12px;overflow:hidden;border:0;padding:0;background:var(--s2);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{flex:1;min-width:0}
.meta .l1{font-weight:700}
.meta .l2{font-size:14px}
.meta .l3{font-size:12px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-top:4px}
.badge.warn{color:var(--warn);border-color:rgba(251,191,36,.4)}
.badge.bad{color:var(--bad);border-color:rgba(248,113,113,.4)}
.side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.gain{font-size:22px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.gain.capped{color:var(--warn)}
.acts{display:flex}

.code{font:700 34px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:var(--gold);text-align:center;padding:10px 0}
.members{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.members li{display:flex;align-items:center;gap:10px}
.members li .badge{margin:0 0 0 auto}
.limits-form{gap:10px}
details.more summary{cursor:pointer;font-weight:600}
details.more[open] summary{margin-bottom:12px}
details.more form{margin-top:8px}

/* ---------- Karte ---------- */
.mapwrap{height:100%;display:flex;flex-direction:column}
.maptools{padding:10px 14px}
.map{flex:1;min-height:260px;background:var(--s1)}
.maphint{padding:8px 14px calc(var(--nav) + 8px + env(safe-area-inset-bottom));margin:0}
.leaflet-container{font:inherit;background:var(--s1)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--s1);color:var(--tx);border:1px solid var(--line)}
.leaflet-popup-content{margin:12px 14px}
.mk{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0b0b14;font-weight:700;border:2px solid #0b0b14;box-shadow:0 0 0 2px var(--c)}
.mk i{position:absolute;right:-8px;top:-8px;min-width:18px;height:18px;border-radius:99px;background:#0b0b14;color:var(--gold);font:700 11px/18px sans-serif;text-align:center;font-style:normal;border:1px solid var(--gold);padding:0 4px}
.pop{display:flex;flex-direction:column;gap:10px;min-width:190px}
.pop-row{display:flex;gap:10px;align-items:center;font-size:13px;line-height:1.35}
.pop-row img{width:54px;height:54px;object-fit:cover;border-radius:10px;background:var(--s2);flex:none}
.pop-sub{color:var(--mut)}
.pop-more{font-size:12px;color:var(--mut)}

/* ---------- Getränk loggen ---------- */
.sheet{position:fixed;inset:0;background:rgba(3,3,10,.66);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-card{width:100%;max-width:560px;max-height:94dvh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px 18px}
.sheet-head h2{font-size:20px}
.sheet-body{padding:8px 16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:0;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600;cursor:pointer;min-height:44px;justify-content:center}
.chip small{color:var(--mut);font-weight:400;font-size:11px}
.chip.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:-6px}
.custom{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.pv-pts{font-size:15px;color:var(--mut)}
.pv-pts b{font-size:38px;color:var(--gold);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.pv-sub{font-size:12px}
.note{margin-top:8px;font-size:13px;padding:8px 10px;border-radius:10px}
.note.warn{background:rgba(251,191,36,.1);color:var(--warn)}
.note.bad{background:rgba(248,113,113,.1);color:var(--bad)}
.photo-btn{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:22px 12px;border:1.5px dashed var(--vio);border-radius:16px;background:rgba(167,139,250,.06);color:var(--vio);cursor:pointer}
.photo-btn .ic{width:30px;height:30px}
.photo-btn span{font-weight:700}
.photo-btn small{color:var(--mut)}
.shot-wrap{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.shot{width:100%;max-height:240px;object-fit:cover;border-radius:16px;border:1px solid var(--line)}
.geo{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.wait{background:var(--warn)}

.camera{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.camera video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
.cam-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 22px calc(20px + env(safe-area-inset-bottom));background:#000}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:transparent;padding:0;cursor:pointer;position:relative}
.shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.shutter:active::after{inset:8px}
.cam-link{background:transparent;border:0;color:#fff;font-size:14px;max-width:110px;text-align:left;cursor:pointer;opacity:.85}
.cam-msg{position:absolute;top:calc(20px + env(safe-area-inset-top));left:16px;right:16px;text-align:center;color:#fff;background:rgba(0,0,0,.55);border-radius:12px;padding:10px;font-size:14px}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:grid;place-items:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));max-width:min(92vw,460px);
  background:#1f1f33;border:1px solid var(--line);color:var(--tx);padding:12px 16px;border-radius:14px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px;text-align:center}
.toast.bad{border-color:rgba(248,113,113,.6)}
.toast.good{border-color:rgba(212,175,55,.7)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-glass" viewBox="0 0 24 24"><path d="M7 3h10l-1.2 16.2a2 2 0 0 1-2 1.8h-3.6a2 2 0 0 1-2-1.8L7 3z"/><path d="M7.6 8h8.8"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4z"/><path d="M9 4v13M15 7v13"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.5 0 4.5 1.7 4.5 4.5"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</svg>

<div id="boot">Lädt…</div>

<section id="screen-auth" hidden></section>

<section id="screen-app" hidden>
  <header class="top">
    <div class="sel">
      <select id="group-select" aria-label="Gruppe wählen"></select>
      <svg class="ic" aria-hidden="true"><use href="#i-chevron"></use></svg>
    </div>
    <button class="icon-btn" data-action="refresh" aria-label="Aktualisieren"><svg class="ic" aria-hidden="true"><use href="#i-refresh"></use></svg></button>
  </header>
  <main id="view"></main>
  <nav class="tabs" aria-label="Hauptmenü">
    <button data-tab="rank"><svg class="ic" aria-hidden="true"><use href="#i-trophy"></use></svg>Rangliste</button>
    <button data-tab="feed"><svg class="ic" aria-hidden="true"><use href="#i-list"></use></svg>Verlauf</button>
    <button class="plus" data-action="open-log" aria-label="Getränk loggen"><svg class="ic" aria-hidden="true"><use href="#i-plus"></use></svg></button>
    <button data-tab="map"><svg class="ic" aria-hidden="true"><use href="#i-map"></use></svg>Karte</button>
    <button data-tab="group"><svg class="ic" aria-hidden="true"><use href="#i-users"></use></svg>Gruppe</button>
  </nav>
</section>

<div id="sheet" class="sheet" hidden></div>

<div id="camera" class="camera" hidden>
  <video id="cam-video" playsinline muted autoplay></video>
  <div id="cam-msg" class="cam-msg" hidden></div>
  <div class="cam-bar">
    <button class="cam-link" data-action="cam-file">Systemkamera nutzen</button>
    <button class="shutter" data-action="cam-capture" aria-label="Foto aufnehmen"></button>
    <button class="cam-link" data-action="cam-close" style="text-align:right">Abbrechen</button>
  </div>
</div>
<input id="file-fallback" type="file" accept="image/*" capture="environment" hidden>

<div id="lightbox" class="lightbox" data-action="zoom-close" hidden><img alt="Foto"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="logic.js"></script>
<script src="views.js"></script>
<script src="app.js"></script>
</body>
</html>
